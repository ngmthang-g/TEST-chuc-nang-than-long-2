name: Build Windows v1.1.5 Long Pha Thien test

on:
  push:
  pull_request:

jobs:
  build-v115:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
      - name: Build and self-test
        shell: cmd
        run: build.cmd
      - name: Upload v1.1.5 test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLongTestAutoHeal-v1.1.5
          path: |
            dist/ThanLongTestAutoHeal_v1.1.5.exe
            dist/ThanLongCleanRouteBridge.dll
          if-no-files-found: error
