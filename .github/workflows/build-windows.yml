name: Build Than Long OfflineKey30d Windows EXE

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thanlong-offline-key-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore, verify, build and test offline source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $statusDir = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $statusDir | Out-Null
          Remove-Item "$statusDir\OFFLINE_BUILD_FAILED.txt" -ErrorAction SilentlyContinue

          try {
            $parts = Get-ChildItem source_parts/mini_* | Sort-Object Name
            if ($parts.Count -lt 8) { throw "Offline source bundle incomplete: found $($parts.Count) parts" }
            $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
            [IO.File]::WriteAllBytes('source_bundle.zip', [Convert]::FromBase64String($b64))

            $sourceHash = (Get-FileHash source_bundle.zip -Algorithm SHA256).Hash.ToLower()
            $expectedHash = 'a64d11d3b98e07eb8d884f6f8b737cceb6961418dff5489a8ed52fb0270bd43a'
            Write-Host "Offline source SHA256: $sourceHash"
            if ($sourceHash -ne $expectedHash) { throw "Offline source SHA256 mismatch: $sourceHash" }

            Remove-Item source -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path source | Out-Null
            Expand-Archive source_bundle.zip -DestinationPath source -Force
            if (-not (Test-Path 'source\CMakeLists.txt')) { throw 'Missing CMakeLists.txt' }
            if (-not (Test-Path 'source\src\controller.cpp')) { throw 'Missing controller.cpp' }
            if (-not (Test-Path 'source\src\license_manager.h')) { throw 'Missing offline license_manager.h' }

            $configureOut = & cmake -S source -B build -A x64 -DCMAKE_BUILD_TYPE=Release 2>&1
            $configureCode = $LASTEXITCODE
            $configureOut | Set-Content "$statusDir\OFFLINE_CMAKE_CONFIGURE.txt" -Encoding UTF8
            $configureOut | Write-Host
            if ($configureCode -ne 0) { throw "CMake configure failed: $configureCode" }

            $buildOut = & cmake --build build --config Release --parallel 2>&1
            $buildCode = $LASTEXITCODE
            $buildOut | Set-Content "$statusDir\OFFLINE_CMAKE_BUILD.txt" -Encoding UTF8
            $buildOut | Write-Host
            if ($buildCode -ne 0) { throw "Release build failed: $buildCode" }

            $tests = @(
              'route_logic_tests.exe',
              'rotation_logic_tests.exe',
              'trade_coordinator_logic_tests.exe',
              'background_ui_logic_tests.exe',
              'fixed_slot_sell_logic_tests.exe',
              'unity_geometry_logic_tests.exe',
              'internal_ui_click_logic_tests.exe',
              'travel_fight_guard_logic_tests.exe',
              'auto_fight_retry_logic_tests.exe'
            )
            $testLog = @()
            foreach ($t in $tests) {
              $testPath = Join-Path 'build\Release' $t
              if (-not (Test-Path $testPath)) { throw "Missing test executable: $t" }
              $out = & $testPath 2>&1
              $code = $LASTEXITCODE
              $testLog += "==== $t (exit=$code) ===="
              $testLog += $out
              if ($code -ne 0) {
                $testLog | Set-Content "$statusDir\OFFLINE_LOGIC_TESTS.txt" -Encoding UTF8
                throw "$t failed: $code"
              }
            }
            $testLog | Set-Content "$statusDir\OFFLINE_LOGIC_TESTS.txt" -Encoding UTF8

            Remove-Item artifact -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path artifact | Out-Null
            Copy-Item build\Release\ThanLongItemConsolidator.exe artifact\ThanLongItemConsolidator_v0.6.1.10_OfflineKey30d.exe -Force
            Copy-Item build\Release\ThanLongCleanRouteBridge.dll artifact\ThanLongCleanRouteBridge.dll -Force
            if (Test-Path source\VERSION.txt) { Copy-Item source\VERSION.txt artifact\VERSION.txt -Force }

            $exeHash = (Get-FileHash artifact\ThanLongItemConsolidator_v0.6.1.10_OfflineKey30d.exe -Algorithm SHA256).Hash.ToLower()
            @(
              'SUCCESS',
              "source_sha256=$sourceHash",
              "exe_sha256=$exeHash",
              "built_from=$env:GITHUB_SHA",
              "run_id=$env:GITHUB_RUN_ID",
              "built_utc=$([DateTime]::UtcNow.ToString('o'))"
            ) | Set-Content "$statusDir\OFFLINE_BUILD_STATUS.txt" -Encoding UTF8
          }
          catch {
            @(
              'FAILED',
              "built_from=$env:GITHUB_SHA",
              "run_id=$env:GITHUB_RUN_ID",
              "failed_utc=$([DateTime]::UtcNow.ToString('o'))",
              "error=$($_.Exception.Message)"
            ) | Set-Content "$statusDir\OFFLINE_BUILD_FAILED.txt" -Encoding UTF8
            Copy-Item "$statusDir\OFFLINE_BUILD_FAILED.txt" "$statusDir\OFFLINE_BUILD_STATUS.txt" -Force
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Publish offline-key Windows build status [skip ci]'
            git push origin HEAD:main
          }

          if ((Get-Content "$statusDir\OFFLINE_BUILD_STATUS.txt" -First 1).Trim() -ne 'SUCCESS') {
            throw (Get-Content "$statusDir\OFFLINE_BUILD_STATUS.txt" -Raw)
          }

      - name: Upload final EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-v0.6.1.10-OfflineKey30d-Win64
          path: artifact/*
          if-no-files-found: error
