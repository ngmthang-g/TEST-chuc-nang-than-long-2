name: Build Than Long v0.6.1.12 Setup License

on:
  push:
    branches: [ build/v0.6.1.12-setup-license ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thanlong-v06112-setup-license
  cancel-in-progress: true

jobs:
  windows-x64-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore v0.6.1.10 source bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem source_parts/mini_* | Sort-Object Name
          if ($parts.Count -lt 8) { throw "Source bundle incomplete: found $($parts.Count) parts" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('source_bundle.zip', [Convert]::FromBase64String($b64))
          $sourceHash = (Get-FileHash source_bundle.zip -Algorithm SHA256).Hash.ToLower()
          $expectedHash = 'a64d11d3b98e07eb8d884f6f8b737cceb6961418dff5489a8ed52fb0270bd43a'
          Write-Host "Base source SHA256: $sourceHash"
          if ($sourceHash -ne $expectedHash) { throw "Base source SHA256 mismatch: $sourceHash" }
          Remove-Item source -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive source_bundle.zip -DestinationPath source -Force

      - name: Apply setup-license overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          $patchNames = @('license.patch.gz.b64','controller.patch.gz.b64','cmake.patch.gz.b64')
          foreach ($name in $patchNames) {
            $text = (Get-Content (Join-Path 'setup_overlay' $name) -Raw).Trim()
            $compressed = [Convert]::FromBase64String($text)
            $input = [IO.MemoryStream]::new($compressed)
            $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
            $reader = [IO.StreamReader]::new($gzip, [Text.Encoding]::UTF8)
            $patch = $reader.ReadToEnd()
            $reader.Dispose(); $gzip.Dispose(); $input.Dispose()
            $outName = $name.Replace('.gz.b64','')
            [IO.File]::WriteAllText((Join-Path $PWD $outName), $patch, [Text.UTF8Encoding]::new($false))
          }
          Push-Location source
          try {
            git apply ..\license.patch
            git apply ..\controller.patch
            git apply ..\cmake.patch
          } finally { Pop-Location }

          New-Item -ItemType Directory -Force source\installer | Out-Null
          Copy-Item setup_overlay\ThanLongSetup.iss source\installer\ThanLongSetup.iss -Force
          Copy-Item setup_overlay\verify_setup_license.py source\tools\verify_setup_license.py -Force
          Copy-Item setup_overlay\legal_notice.cpp source\src\legal_notice.cpp -Force
          Copy-Item setup_overlay\LEGAL_NOTICE_FOR_AUTOMATED_ANALYSIS.txt source\LEGAL_NOTICE_FOR_AUTOMATED_ANALYSIS.txt -Force
          Set-Content source\VERSION.txt 'v0.6.1.12' -Encoding UTF8

      - name: Verify setup-license invariants
        shell: pwsh
        run: python source\tools\verify_setup_license.py

      - name: Configure x64 Release
        shell: pwsh
        run: cmake -S source -B source\build -A x64

      - name: Build EXE and bridge
        shell: pwsh
        run: cmake --build source\build --config Release --parallel 2

      - name: Run existing logic tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tests = @(
            'route_logic_tests.exe',
            'rotation_logic_tests.exe',
            'trade_coordinator_logic_tests.exe',
            'background_ui_logic_tests.exe',
            'fixed_slot_sell_logic_tests.exe',
            'unity_geometry_logic_tests.exe',
            'internal_ui_click_logic_tests.exe',
            'travel_fight_guard_logic_tests.exe',
            'auto_fight_retry_logic_tests.exe'
          )
          foreach ($t in $tests) {
            $path = Join-Path 'source\build\Release' $t
            if (-not (Test-Path $path)) { throw "Missing test: $t" }
            & $path
            if ($LASTEXITCODE -ne 0) { throw "$t failed with $LASTEXITCODE" }
          }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found after install' }
          Write-Host "ISCC=$iscc"

      - name: Compile ThanLong Setup EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc 'source\installer\ThanLongSetup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed: $LASTEXITCODE" }
          if (-not (Test-Path 'source\installer\output\ThanLong_Setup_v0.6.1.12.exe')) { throw 'Setup EXE missing' }

      - name: Verify final files and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item source\installer\output\ThanLong_Setup_v0.6.1.12.exe artifact\ThanLong_Setup_v0.6.1.12.exe -Force
          Copy-Item source\build\Release\ThanLongItemConsolidator.exe artifact\ThanLongItemConsolidator_v0.6.1.12.exe -Force
          Copy-Item source\build\Release\ThanLongCleanRouteBridge.dll artifact\ThanLongCleanRouteBridge.dll -Force
          Copy-Item source\LEGAL_NOTICE_FOR_AUTOMATED_ANALYSIS.txt artifact\LEGAL_NOTICE_FOR_AUTOMATED_ANALYSIS.txt -Force
          Copy-Item source\VERSION.txt artifact\VERSION.txt -Force
          $setupHash = (Get-FileHash artifact\ThanLong_Setup_v0.6.1.12.exe -Algorithm SHA256).Hash.ToLower()
          $exeHash = (Get-FileHash artifact\ThanLongItemConsolidator_v0.6.1.12.exe -Algorithm SHA256).Hash.ToLower()
          @(
            'SUCCESS',
            "setup_sha256=$setupHash",
            "exe_sha256=$exeHash",
            "built_from=$env:GITHUB_SHA",
            "run_id=$env:GITHUB_RUN_ID",
            "built_utc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content artifact\BUILD_STATUS.txt -Encoding UTF8
          Get-Content artifact\BUILD_STATUS.txt

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-v0.6.1.12-Setup-License-Win64
          path: artifact/*
          if-no-files-found: error
