name: Build Than Long v0.6.1.12 Setup (fixed)

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-setup-v06112.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thanlong-v06112-setup-fixed
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build, test and package Setup
        shell: pwsh
        run: .\build_scripts\v06112_setup.ps1

      - name: Upload setup artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThanLong-v0.6.1.12-SetupLicense-Win64
          path: artifact/*
          if-no-files-found: error
