name: build-thanlong-license-premium-ui

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'dist/**'
      - 'overlay/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thanlong-main-build
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build verify test and publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $statusDir = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force $statusDir | Out-Null
          Remove-Item "$statusDir\BUILD_FAILED.txt" -ErrorAction SilentlyContinue
          try {
            $parts = Get-ChildItem source\payload.part* | Sort-Object Name
            if ($parts.Count -ne 18) { throw "Expected 18 payload parts, got $($parts.Count)" }
            $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join '')
            [IO.File]::WriteAllBytes('minbuild.zip', [Convert]::FromBase64String($b64))
            $actual = (Get-FileHash minbuild.zip -Algorithm SHA256).Hash.ToLower()
            Write-Host "Payload SHA256: $actual"

            Expand-Archive -Path minbuild.zip -DestinationPath work -Force
            if (-not (Test-Path 'work\CMakeLists.txt')) { throw 'Payload archive is not a valid Than Long build source: missing CMakeLists.txt' }
            if (-not (Test-Path 'work\src\controller.cpp')) { throw 'Payload archive is incomplete: missing src/controller.cpp' }
            if (-not (Test-Path 'work\src\license_gate.cpp')) { throw 'Payload archive is incomplete: missing src/license_gate.cpp' }

            Push-Location work
            try {
              $controllerPath = Join-Path $PWD 'src\controller.cpp'
              $rawController = [IO.File]::ReadAllBytes($controllerPath)
              $utf8Loose = New-Object System.Text.UTF8Encoding($false, $false)
              $controllerText = $utf8Loose.GetString($rawController)

              if ($controllerText -notmatch 'RequireValidLicense') {
                $sig = 'int\s+WINAPI\s+wWinMain\s*\([^\)]*\)\s*\{'
                $m = [regex]::Match($controllerText, $sig)
                if (-not $m.Success) { throw 'Cannot locate wWinMain signature for license-gate repair' }
                $tailStart = $m.Index + $m.Length
                $tail = $controllerText.Substring($tailStart)
                $dpi = [regex]::Match($tail, 'EnableDpiAwareness\s*\(\s*\)\s*;')
                if (-not $dpi.Success) { throw 'Cannot locate EnableDpiAwareness inside wWinMain' }
                $insertAt = $tailStart + $dpi.Index + $dpi.Length
                $licenseLines = "`r`n    thanlong_license::Session licenseSession{};`r`n    if (!thanlong_license::RequireValidLicense(instance, licenseSession)) return 10;"
                $controllerText = $controllerText.Insert($insertAt, $licenseLines)

                $after = $controllerText.Substring($insertAt + $licenseLines.Length)
                $appMatch = [regex]::Match($after, 'App\s+app\s*;')
                if (-not $appMatch.Success) { throw 'Cannot locate App app declaration inside wWinMain' }
                $appEnd = $insertAt + $licenseLines.Length + $appMatch.Index + $appMatch.Length
                $controllerText = $controllerText.Insert($appEnd, "`r`n    app.SetLicenseSession(licenseSession);")
                Write-Host 'Restored startup RequireValidLicense wiring.'
              }

              [IO.File]::WriteAllText($controllerPath, $controllerText, (New-Object System.Text.UTF8Encoding($false)))

              $verifyOut = & python tools\verify_license_ui.py 2>&1
              $verifyCode = $LASTEXITCODE
              $verifyOut | Tee-Object -FilePath '..\dist\VERIFY_LICENSE_UI.txt' | Write-Host
              if ($verifyCode -ne 0) { throw "verify_license_ui.py failed: $verifyCode :: $($verifyOut -join ' | ')" }

              $configureOut = & cmake -S . -B build -A x64 2>&1
              $configureCode = $LASTEXITCODE
              $configureOut | Tee-Object -FilePath '..\dist\CMAKE_CONFIGURE.txt' | Write-Host
              if ($configureCode -ne 0) { throw "CMake configure failed: $configureCode" }

              $buildOut = & cmake --build build --config Release --parallel 2>&1
              $buildCode = $LASTEXITCODE
              $buildOut | Tee-Object -FilePath '..\dist\CMAKE_BUILD.txt' | Write-Host
              if ($buildCode -ne 0) { throw "Release build failed: $buildCode" }

              $tests = @(
                'route_logic_tests.exe',
                'rotation_logic_tests.exe',
                'trade_coordinator_logic_tests.exe',
                'background_ui_logic_tests.exe',
                'fixed_slot_sell_logic_tests.exe',
                'unity_geometry_logic_tests.exe',
                'internal_ui_click_logic_tests.exe',
                'travel_fight_guard_logic_tests.exe',
                'auto_fight_retry_logic_tests.exe'
              )
              $testLog = @()
              foreach ($t in $tests) {
                $out = & ".\build\Release\$t" 2>&1
                $code = $LASTEXITCODE
                $testLog += "==== $t (exit=$code) ===="
                $testLog += $out
                if ($code -ne 0) {
                  $testLog | Set-Content '..\dist\LOGIC_TESTS.txt' -Encoding UTF8
                  throw "$t failed: $code"
                }
              }
              $testLog | Set-Content '..\dist\LOGIC_TESTS.txt' -Encoding UTF8

              New-Item -ItemType Directory -Force stage | Out-Null
              Copy-Item build\Release\ThanLongItemConsolidator.exe stage\ThanLongItemConsolidator_v0.6.1.10.exe
              Copy-Item build\Release\ThanLongCleanRouteBridge.dll stage\ThanLongCleanRouteBridge.dll
              Copy-Item ThanLongLicense.ini stage\ThanLongLicense.ini
              Copy-Item license_server\README.md stage\LICENSE_SETUP.md
              Copy-Item license_server\Code.gs stage\LICENSE_SERVER_Code.gs
              Copy-Item license_server\LICENSE_KEYS_TEMPLATE.csv stage\LICENSE_KEYS_TEMPLATE.csv
              Copy-Item license_server\LICENSE_DEVICES_TEMPLATE.csv stage\LICENSE_DEVICES_TEMPLATE.csv
            }
            finally {
              Pop-Location
            }

            Remove-Item "$statusDir\ThanLongItemConsolidator_v0.6.1.10_GitHubBuild.zip" -ErrorAction SilentlyContinue
            Compress-Archive -Path work\stage\* -DestinationPath "$statusDir\ThanLongItemConsolidator_v0.6.1.10_GitHubBuild.zip" -CompressionLevel Optimal
            Copy-Item work\stage\ThanLongItemConsolidator_v0.6.1.10.exe "$statusDir\ThanLongItemConsolidator_v0.6.1.10.exe" -Force
            Copy-Item work\stage\ThanLongCleanRouteBridge.dll "$statusDir\ThanLongCleanRouteBridge.dll" -Force
            Copy-Item work\stage\ThanLongLicense.ini "$statusDir\ThanLongLicense.ini" -Force
            $exeHash = (Get-FileHash "$statusDir\ThanLongItemConsolidator_v0.6.1.10.exe" -Algorithm SHA256).Hash.ToLower()
            @(
              'SUCCESS',
              "source_payload_sha256=$actual",
              "exe_sha256=$exeHash",
              "built_from=$env:GITHUB_SHA",
              "run_id=$env:GITHUB_RUN_ID",
              "built_utc=$([DateTime]::UtcNow.ToString('o'))"
            ) | Set-Content "$statusDir\BUILD_STATUS.txt" -Encoding UTF8
          }
          catch {
            @(
              'FAILED',
              "built_from=$env:GITHUB_SHA",
              "run_id=$env:GITHUB_RUN_ID",
              "failed_utc=$([DateTime]::UtcNow.ToString('o'))",
              "error=$($_.Exception.Message)"
            ) | Set-Content "$statusDir\BUILD_FAILED.txt" -Encoding UTF8
            Copy-Item "$statusDir\BUILD_FAILED.txt" "$statusDir\BUILD_STATUS.txt" -Force
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          if (-not (git diff --cached --quiet)) {
            git commit -m 'Publish Than Long Windows build status [skip ci]'
            git push origin HEAD:main
          }

          if ((Get-Content "$statusDir\BUILD_STATUS.txt" -First 1).Trim() -ne 'SUCCESS') {
            throw (Get-Content "$statusDir\BUILD_STATUS.txt" -Raw)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ThanLongItemConsolidator-v0.6.1.10-license-premium-ui-win-x64
          path: work\stage
          if-no-files-found: error
