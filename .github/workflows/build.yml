name: publish-v0.6.1.9-docs

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-docs:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/v0.6.1.9-p3-retry-about-roadmap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.6.1.9-p3-retry-about-roadmap
          fetch-depth: 0
      - name: Apply exact v0.6.1.9 documentation patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_v0619_logic.py
          cat .docs0619/chunk0 .docs0619/chunk1 .docs0619/chunk2 .docs0619/chunk3 > /tmp/v0619-docs.b64
          echo 'b2c7b1e266ff8e1998cf786806c40b2627c6b299b0abd6abeb9d847726756a42  /tmp/v0619-docs.b64' | sha256sum -c -
          python - <<'PY'
          import base64, zlib, pathlib
          encoded = pathlib.Path('/tmp/v0619-docs.b64').read_text().strip()
          pathlib.Path('/tmp/v0619-docs.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          echo '190bca9c6481f42b2899ebe077b9e1b5f45ce77761b9760f7d5dcff38283be30  /tmp/v0619-docs.patch' | sha256sum -c -
          git apply --check /tmp/v0619-docs.patch
          git apply /tmp/v0619-docs.patch
          rm -rf .docs0619
          python tools/verify_v0619_logic.py
          git diff --check
      - name: Commit v0.6.1.9 knowledge and history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md CHANGELOG.md PROJECT_KNOWLEDGE.md SOURCE_PROVENANCE.md TOOL_LOGIC_TABLE.html docs/history/VERSION_v0.6.1.9.md
          git add -u -- .docs0619
          git commit -m 'docs: close v0.6.1.9 knowledge with CI evidence'
          git push origin HEAD:codex/v0.6.1.9-p3-retry-about-roadmap
