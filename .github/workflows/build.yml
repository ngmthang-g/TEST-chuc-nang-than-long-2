name: publish-v0.6.1.8-source

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.6.1.8-route-m87-deadcode-clean
          fetch-depth: 0
      - name: Apply exact v0.6.1.8 maintenance patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_v0617_logic.py
          python - <<'PY'
          import base64, zlib, pathlib
          encoded = pathlib.Path('.v0618/patch.b64').read_text().strip()
          pathlib.Path('/tmp/v0618.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          echo 'bba19aebae734f2191514a1aec86147937e31f9d4d687c85a212281876441cc4  /tmp/v0618.patch' | sha256sum -c -
          git apply --check /tmp/v0618.patch
          git apply /tmp/v0618.patch
          rm -f .v0618/patch.b64
          rmdir .v0618
          python tools/verify_v0618_logic.py
          git diff --check
      - name: Commit clean v0.6.1.8 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CHANGELOG.md CMakeLists.txt PROJECT_KNOWLEDGE.md README.md SOURCE_PROVENANCE.md TOOL_LOGIC_TABLE.html VERSION.txt docs/history/VERSION_v0.6.1.7.md docs/history/VERSION_v0.6.1.8.md resources/app.rc src/controller.cpp src/protocol.h src/travel_fight_guard_logic.h src/travel_fight_guard_logic_test.cpp tools/verify_v0618_logic.py
          git rm --cached --ignore-unmatch .v0618/patch.b64 || true
          git add -u -- .v0618/patch.b64
          git commit -m 'refactor: finalize v0.6.1.8 route M87 dead-code maintenance'
          git push origin HEAD:codex/v0.6.1.8-route-m87-deadcode-clean
