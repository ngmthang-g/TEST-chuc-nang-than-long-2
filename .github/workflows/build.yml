name: publish-v0.6.1.7-docs

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.6.1.7-autostop-hidden-sequence-fix
          fetch-depth: 0
      - name: Apply v0.6.1.7 evidence/docs patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, zlib
          encoded=Path('.docs0617/patch.b64').read_text().strip()
          patch=zlib.decompress(base64.b64decode(encoded))
          expected='a14af7e22e7d92d527d9d6f70273389ba1d9ef01864f8ef9473247ed213a75fc'
          assert hashlib.sha256(patch).hexdigest()==expected, 'docs patch SHA mismatch'
          Path('/tmp/v0617-docs.patch').write_bytes(patch)
          PY
          git apply --check /tmp/v0617-docs.patch
          git apply /tmp/v0617-docs.patch
          rm -rf .docs0617
          python tools/verify_v0617_logic.py
          git diff --check
      - name: Commit final evidence docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: record v0.6.1.7 final CI evidence and runtime status'
          git push origin HEAD:codex/v0.6.1.7-autostop-hidden-sequence-fix
