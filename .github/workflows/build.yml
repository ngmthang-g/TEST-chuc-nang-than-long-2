name: publish-v0.6.1.8-source

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.6.1.8-route-m87-deadcode-clean
          fetch-depth: 0
      - name: Apply exact v0.6.1.8 maintenance patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_v0617_logic.py
          cat .v0618/chunk0 .v0618/chunk1 .v0618/chunk2 .v0618/chunk3 > /tmp/v0618.b64
          echo '250f4b0ab8c0b2d06e8d261aa914afc6b8f8ff855bfd39d62a5e55cbb207ea7d  /tmp/v0618.b64' | sha256sum -c -
          python - <<'PY'
          import base64, zlib, pathlib
          encoded = pathlib.Path('/tmp/v0618.b64').read_text().strip()
          pathlib.Path('/tmp/v0618.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          echo 'f275f1816ca94b176473738f8d620fba9d19fc4774555aa42cfaa8ef44ddb5ed  /tmp/v0618.patch' | sha256sum -c -
          git apply --check /tmp/v0618.patch
          git apply /tmp/v0618.patch
          rm -rf .v0618
          python tools/verify_v0618_logic.py
          git diff --check
      - name: Commit clean v0.6.1.8 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CMakeLists.txt VERSION.txt docs/history/VERSION_v0.6.1.8.md resources/app.rc src/controller.cpp src/protocol.h src/travel_fight_guard_logic.h src/travel_fight_guard_logic_test.cpp tools/verify_v0618_logic.py
          git add -u -- .v0618
          git commit -m 'refactor: finalize v0.6.1.8 route M87 dead-code maintenance'
          git push origin HEAD:codex/v0.6.1.8-route-m87-deadcode-clean
