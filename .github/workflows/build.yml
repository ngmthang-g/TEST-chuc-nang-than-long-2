name: publish-v0.6.1.10-source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/v0.6.1.10-about-bullets-crlf'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.6.1.10-about-bullets-crlf
          fetch-depth: 0
      - name: Apply exact v0.6.1.10 About formatting patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_v0619_logic.py
          cat .v06110/chunk0 .v06110/chunk1 > /tmp/v06110.b64
          echo '8b5adfffe5d0f26770df32684949f7a61e43fab022725174cfdf494349230397  /tmp/v06110.b64' | sha256sum -c -
          python - <<'PY'
          import base64, zlib, pathlib
          encoded = pathlib.Path('/tmp/v06110.b64').read_text().strip()
          pathlib.Path('/tmp/v06110.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          echo 'b631889562421c3c07bc07cbd935e62e38137e8959a05683a4910d85fd9a05af  /tmp/v06110.patch' | sha256sum -c -
          git apply --check --exclude=tools/verify_v06110_logic.py --exclude=docs/history/VERSION_v0.6.1.10.md /tmp/v06110.patch
          git apply --exclude=tools/verify_v06110_logic.py --exclude=docs/history/VERSION_v0.6.1.10.md /tmp/v06110.patch
          rm -rf .v06110
          cp .github/workflows/build.yml /tmp/build-v06110.yml
          python tools/verify_v06110_logic.py
          git show HEAD:.github/workflows/build.yml > .github/workflows/build.yml
          git diff --check
      - name: Commit clean v0.6.1.10 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CMakeLists.txt VERSION.txt resources/app.rc src/controller.cpp src/protocol.h
          git add -u -- .v06110
          git commit -m 'v0.6.1.10: format About roadmap bullets with CRLF'
          git push origin HEAD:codex/v0.6.1.10-about-bullets-crlf
