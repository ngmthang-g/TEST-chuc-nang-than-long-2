name: publish-v0.6.1.9-source

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'codex/v0.6.1.9-p3-retry-about-roadmap'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.6.1.9-p3-retry-about-roadmap
          fetch-depth: 0
      - name: Apply exact v0.6.1.9 runtime patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_v0618_logic.py
          cat .v0619/chunk0 .v0619/chunk1 .v0619/chunk2 .v0619/chunk3 > /tmp/v0619.b64
          echo 'd9be514fc57976d51a477b59c5ea9010e076de3e25524aa319f7b63dd6dd371f  /tmp/v0619.b64' | sha256sum -c -
          python - <<'PY'
          import base64, zlib, pathlib
          encoded = pathlib.Path('/tmp/v0619.b64').read_text().strip()
          pathlib.Path('/tmp/v0619.patch').write_bytes(zlib.decompress(base64.b64decode(encoded)))
          PY
          echo 'bda0bffd8ceacd07d8fc793967aeb9106807abd8203afaba12ae0abe7a6a8df9  /tmp/v0619.patch' | sha256sum -c -
          git apply --check /tmp/v0619.patch
          git apply /tmp/v0619.patch
          rm -rf .v0619
          cp .github/workflows/build.yml /tmp/build-v0618.yml
          cat > .github/workflows/build.yml <<'YAML'
          name: build-item-consolidator-v0.6.1.9

          on:
            push:
            pull_request:
            workflow_dispatch:

          jobs:
            windows-x64:
              runs-on: windows-latest
              steps:
                - uses: actions/checkout@v4
                - name: Verify v0.6.1.9 P3 retry + 60s coordinate check + About roadmap
                  run: python tools/verify_v0619_logic.py
                - name: Configure x64
                  run: cmake -S . -B build -A x64
                - name: Build Release
                  run: cmake --build build --config Release --parallel
                - name: Route logic self-test
                  run: .\build\Release\route_logic_tests.exe
                - name: Rotation logic self-test
                  run: .\build\Release\rotation_logic_tests.exe
                - name: Shared coordinator self-test
                  run: .\build\Release\trade_coordinator_logic_tests.exe
                - name: Background UI scoring self-test
                  run: .\build\Release\background_ui_logic_tests.exe
                - name: Fixed-slot sell logic self-test
                  run: .\build\Release\fixed_slot_sell_logic_tests.exe
                - name: Unity geometry resolver self-test
                  run: .\build\Release\unity_geometry_logic_tests.exe
                - name: Internal UI point-click plan self-test
                  run: .\build\Release\internal_ui_click_logic_tests.exe
                - name: AutoPath and AutoFight invariant self-test
                  run: .\build\Release\travel_fight_guard_logic_tests.exe
                - name: AutoFight retry timer self-test
                  run: .\build\Release\auto_fight_retry_logic_tests.exe
                - name: Stage artifact
                  shell: pwsh
                  run: |
                    New-Item -ItemType Directory -Force stage | Out-Null
                    Copy-Item build\Release\ThanLongItemConsolidator.exe stage\ThanLongItemConsolidator_v0.6.1.9.exe
                    Copy-Item build\Release\ThanLongCleanRouteBridge.dll stage\ThanLongCleanRouteBridge.dll
                    Copy-Item README.md,PROJECT_KNOWLEDGE.md,CHANGELOG.md,VERSION.txt,SOURCE_PROVENANCE.md,TOOL_LOGIC_TABLE.html,DONOR_0.8.4_BACKGROUND_ACTION_ANALYSIS.md stage\
                    Copy-Item docs stage\docs -Recurse
                - uses: actions/upload-artifact@v4
                  with:
                    name: ThanLongItemConsolidator-v0.6.1.9-win-x64
                    path: stage
                    if-no-files-found: error
          YAML
          python tools/verify_v0619_logic.py
          mv /tmp/build-v0618.yml .github/workflows/build.yml
          git diff --check
      - name: Commit clean v0.6.1.9 source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CMakeLists.txt VERSION.txt resources/app.rc src/controller.cpp src/protocol.h src/auto_fight_retry_logic.h src/auto_fight_retry_logic_test.cpp tools/verify_v0619_logic.py
          git add -u -- .v0619
          git commit -m 'v0.6.1.9: fix P3 retry deadlock and add roadmap UI'
          git push origin HEAD:codex/v0.6.1.9-p3-retry-about-roadmap
