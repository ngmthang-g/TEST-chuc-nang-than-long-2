name: publish-v0.6.1.7-source

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.6.1.7-autostop-hidden-sequence-fix
          fetch-depth: 0
      - name: Apply exact v0.6.1.7 patch and verify
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_v0616_logic.py
          git fetch origin codex/v0.6.1.6-per-client-clean-movement-guard
          git show origin/codex/v0.6.1.6-per-client-clean-movement-guard:tools/verify_v0616_logic.py > tools/verify_v0616_logic.py
          git checkout HEAD -- .github/workflows/build.yml
          rm -rf .v0617 .v0617_exact.patch
          git diff --check
      - name: Commit clean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: restore hidden AUTO then StopAuto2 lifecycle in v0.6.1.7'
          git push origin HEAD:codex/v0.6.1.7-autostop-hidden-sequence-fix
