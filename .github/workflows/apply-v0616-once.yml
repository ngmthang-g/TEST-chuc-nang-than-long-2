name: apply-v0.6.1.6-once

on:
  push:
    branches:
      - codex/v0.6.1.6-per-client-clean-movement-guard

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'feat: finalize v0.6.1.6 per-client cleanup and movement guard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and apply exact v0.6.1.6 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v0616/chunk1 .v0616/chunk2 .v0616/chunk3 .v0616/chunk4 > /tmp/v0616.b64
          python - <<'PY'
          import base64,zlib,pathlib
          s=pathlib.Path('/tmp/v0616.b64').read_text().strip()
          pathlib.Path('/tmp/v0616.patch').write_bytes(zlib.decompress(base64.b64decode(s)))
          PY
          echo 'fa29c25b7c47f91aabfccacbb5d4d214d3d1dbabd9179f09d55ecd0c8dd5c426  /tmp/v0616.patch' | sha256sum -c -
          git apply --check /tmp/v0616.patch
          git apply /tmp/v0616.patch
          rm -rf .v0616 .github/workflows/apply-v0616-once.yml
          python tools/verify_v0616_logic.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: finalize v0.6.1.6 per-client cleanup and movement guard'
          git push origin HEAD:codex/v0.6.1.6-per-client-clean-movement-guard
